{% set name = "mkdocs-table-reader-plugin" %}
{% set version = "4.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 77c3b60eb7026b0de0711428f0b996ca7633486a8ff80956c99761625f97f06b

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  noarch: python

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - mkdocs >=1.0
    - pandas >=2.1
    - tabulate >=0.8.7
    - PyYAML >=5.4.1
    # - pyyaml >=5.4.1

test:
  imports:
    - mkdocs_table_reader_plugin
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://timvink.github.io/mkdocs-table-reader-plugin/#documentation
  summary: MkDocs plugin to directly insert tables from files into markdown.
  description: MkDocs plugin to directly insert tables from files into markdown.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://timvink.github.io/mkdocs-table-reader-plugin/#documentation
  dev_url: https://github.com/timvink/mkdocs-table-reader-plugin

extra:
  recipe-maintainers:
    - cpcloud
